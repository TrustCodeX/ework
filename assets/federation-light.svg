<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 920 300" role="img" aria-label="Two independent hosts. The example.net host fetches the well-known discovery document from eworkprotocol.org, learns its public key and inbox address, then posts an envelope signed with its own key, which the receiving host verifies.">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23231f"/>
    </marker>
  </defs>
  <rect x="0" y="110" width="260" height="60" rx="8" fill="#ffffff" stroke="#23231f" stroke-width="1.5"/>
  <text x="130.0" y="135.0" text-anchor="middle" font-size="13" font-weight="600" fill="#23231f">bruno@example.net</text>
  <text x="130.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#63625c">host B, key hB</text>
  <rect x="660" y="110" width="260" height="60" rx="8" fill="#ffffff" stroke="#23231f" stroke-width="1.5"/>
  <text x="790.0" y="135.0" text-anchor="middle" font-size="13" font-weight="600" fill="#23231f">ana@eworkprotocol.org</text>
  <text x="790.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#63625c">host A, key hA</text>
  <rect x="300" y="20" width="320" height="56" rx="8" fill="#ffffff" stroke="#23231f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460.0" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#23231f">eworkprotocol.org/.well-known/ework</text>
  <text x="460.0" y="61.0" text-anchor="middle" font-size="11.5" fill="#63625c">public key and inbox address</text>
  <path d="M 130 110 L 130 48 L 294 48" fill="none" stroke="#23231f" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="140" y="42" font-size="11.5" fill="#63625c">1. reads</text>
  <line x1="260" y1="140" x2="654" y2="140" stroke="#1d6f56" stroke-width="2" marker-end="url(#seta)"/>
  <text x="457.0" y="132.0" text-anchor="middle" font-size="11.5" fill="#63625c">2. posts envelope signed with hB</text>
  <text x="457" y="162" text-anchor="middle" font-size="11.5" fill="#63625c">3. verifies against hB</text>
  <text x="460" y="248" text-anchor="middle" font-size="12" fill="#63625c">no registry, no central node, nobody to ask permission from</text>
</svg>
