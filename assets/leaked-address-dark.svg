<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 920 260" role="img" aria-label="Three attempts against the same host: a scraped address without the credential, an address that was retired, and an address that never existed. All three receive the same refusal, so the response reveals nothing.">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6e4dc"/>
    </marker>
  </defs>
  <text x="0" y="20" font-size="12" font-weight="600" fill="#a3a199" letter-spacing="0.06em">WHAT A LEAKED ADDRESS IS WORTH</text>
  <rect x="0" y="44" width="240" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="120.0" y="67.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Scraped address</text>
  <text x="120.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#a3a199">no credential</text>
  <path d="M 120.0 100 L 120.0 118 L 460 118 L 460 152" fill="none" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <rect x="340" y="44" width="240" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="460.0" y="67.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Retired address</text>
  <text x="460.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#a3a199">you shut it off</text>
  <path d="M 460.0 100 L 460.0 118 L 460 118 L 460 152" fill="none" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <rect x="680" y="44" width="240" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="800.0" y="67.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Address that</text>
  <text x="800.0" y="85.0" text-anchor="middle" font-size="11.5" fill="#a3a199">never existed</text>
  <path d="M 800.0 100 L 800.0 118 L 460 118 L 460 152" fill="none" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <rect x="280" y="156" width="360" height="56" rx="8" fill="#16302a" stroke="#6fc9a5" stroke-width="2"/>
  <text x="460.0" y="179.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">403 no-consent</text>
  <text x="460.0" y="197.0" text-anchor="middle" font-size="11.5" fill="#a3a199">identical in code, body and timing</text>
  <text x="460" y="236" text-anchor="middle" font-size="11.5" fill="#a3a199">the host does not say which</text>
</svg>
