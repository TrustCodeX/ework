<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 1040 400" role="img" aria-label="Flow diagram. First contact: issuer knocks, the host edge finds no relationship, the knock waits in silent quarantine, you grant consent, and an address plus credential are minted. Afterwards: the issuer sends an offer carrying that credential, the edge checks it matches, and the task lands in your inbox; a wrong credential is refused with no consent.">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6e4dc"/>
    </marker>
  </defs>
  <text x="0" y="22" font-size="12" font-weight="600" fill="#a3a199" letter-spacing="0.06em">FIRST CONTACT, ONCE</text>
  <rect x="0" y="62" width="170" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="85.0" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Issuer</text>
  <text x="85.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a3a199">the energy company</text>
  <line x1="170" y1="90.0" x2="274" y2="90.0" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="222.0" y="82.0" text-anchor="middle" font-size="11.5" fill="#a3a199">knock</text>
  <rect x="280" y="62" width="190" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="375.0" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Edge of your host</text>
  <text x="375.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a3a199">runs before delivery</text>
  <line x1="470" y1="90.0" x2="574" y2="90.0" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="522.0" y="82.0" text-anchor="middle" font-size="11.5" fill="#a3a199">no relationship</text>
  <rect x="580" y="62" width="190" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="675.0" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Silent quarantine</text>
  <text x="675.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a3a199">no notification</text>
  <line x1="770" y1="90.0" x2="864" y2="90.0" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="817.0" y="82.0" text-anchor="middle" font-size="11.5" fill="#a3a199">you review, once</text>
  <rect x="870" y="62" width="170" height="56" rx="8" fill="#16302a" stroke="#6fc9a5" stroke-width="2"/>
  <text x="955.0" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">You grant</text>
  <text x="955.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a3a199">scope and limits</text>
  <path d="M 955.0 118 L 955.0 176 L 85 176 L 85 256" fill="none" stroke="#6fc9a5" stroke-width="2" marker-end="url(#seta)"/>
  <text x="520" y="170" text-anchor="middle" font-size="11.5" fill="#6fc9a5">mints ka03d9d9f@you, address + credential</text>
  <text x="0" y="234" font-size="12" font-weight="600" fill="#a3a199" letter-spacing="0.06em">EVERY TIME AFTER THAT</text>
  <rect x="0" y="268" width="170" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="85.0" y="291.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Issuer</text>
  <text x="85.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#a3a199">holds the credential</text>
  <line x1="170" y1="296.0" x2="274" y2="296.0" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="222.0" y="288.0" text-anchor="middle" font-size="11.5" fill="#a3a199">task offer</text>
  <rect x="280" y="268" width="190" height="56" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="375.0" y="291.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Edge</text>
  <text x="375.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#a3a199">credential matches?</text>
  <line x1="470" y1="296.0" x2="574" y2="296.0" stroke="#6fc9a5" stroke-width="2" marker-end="url(#seta)"/>
  <text x="522.0" y="288.0" text-anchor="middle" font-size="11.5" fill="#a3a199">yes</text>
  <rect x="580" y="268" width="190" height="56" rx="8" fill="#16302a" stroke="#6fc9a5" stroke-width="2"/>
  <text x="675.0" y="291.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">Your inbox</text>
  <text x="675.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#a3a199">a task, with a deadline</text>
  <path d="M 375.0 324 L 375.0 358" fill="none" stroke="#e6e4dc" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="385.0" y="348" font-size="11.5" fill="#a3a199">no</text>
  <rect x="280" y="364" width="190" height="44" rx="8" fill="#1d1d22" stroke="#e6e4dc" stroke-width="1.5"/>
  <text x="375.0" y="381.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6e4dc">403 no-consent</text>
  <text x="375.0" y="399.0" text-anchor="middle" font-size="11.5" fill="#a3a199">same as no relationship</text>
</svg>
